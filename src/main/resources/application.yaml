spring:
  application:
    name: quiz-application

  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME:Quiz}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 6769